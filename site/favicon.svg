<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <linearGradient id="well" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#121016"/>
      <stop offset="1" stop-color="#1a1720"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.45" stop-color="#ff8a45"/>
      <stop offset="1" stop-color="#ff4a5c"/>
    </linearGradient>
  </defs>
  <!-- full bleed and opaque: search results and tabs crop it to their own shape -->
  <rect width="512" height="512" fill="url(#well)"/>
  <circle cx="256" cy="266" r="168" fill="#ff5a4a" opacity="0.5" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="136" fill="url(#dot)"/>
</svg>
